<style>
/* studenti.org.rs tokens (via lastm brand/design-tokens, light only). */
:root {

  --brand-text-soft: #585858;
  --brand-text-faint: #757575;
  --brand-rule: rgba(35, 31, 32, .5);
  --brand-link: #a81a32;
  --brand-on-primary: #ffffff;
  --brand-on-ink: #ffffff;
  --cat-march: hsl(350 72% 38%);
  --cat-media: hsl(206 72% 38%);
  --cat-org: hsl(134 72% 38%);
  --font-sans: 'Golog Text', 'Inter Tight', Arial, sans-serif;
  --fs-display: clamp(2.25rem, 5vw, 3.5rem);
  --fs-h2: 1.75rem;
  --fs-h3: 1.5rem;
  --fs-body: 1rem;
  --fs-small: .875rem;
  --fs-micro: .75rem;
  --lh-tight: 1;
  --lh-body: 1.5;
  --radius-control: .5rem;
  --radius-card: 10px;
  --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
  --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
  --header-bg: hsla(0 0% 100% / .8);
  --header-blur: 6px;
}
html { background: var(--brand-surface); scroll-behavior: smooth; }
body {
  margin: 0; color: var(--brand-text); background: var(--brand-surface);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-weight: 700; line-height: var(--lh-tight); margin: 0 0 var(--space-4); }
h1 { font-size: var(--fs-display); }
p { margin: 0 0 var(--space-3); }
a { color: var(--brand-link); text-decoration: underline; }
a:hover { color: var(--brand-primary-dark); }
.faint { color: var(--brand-text-soft); }

/* header (sticky glass) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-surface); }
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; background: var(--header-bg); backdrop-filter: blur(var(--header-blur)); border-bottom: 1px solid var(--brand-surface-soft); }
.site-header nav { max-width: 70rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: var(--space-2); min-height: 3.5rem; }
.site-header .brand { color: var(--brand-text); text-decoration: none; font-weight: 700; padding: var(--space-3) var(--space-2); }
.site-header .spacer { flex: 1; }
.site-header .section { font-weight: 500; padding: var(--space-3) var(--space-2); border-bottom: 4px solid var(--brand-primary); }
.lang button { font: inherit; font-size: var(--fs-small); font-weight: 700; background: none; border: 0; border-bottom: 4px solid transparent; padding: var(--space-3) var(--space-2); color: var(--brand-text); cursor: pointer; }
.lang button:hover { background: hsla(from var(--brand-tint) h s l / .9); }
.lang button:focus-visible, .filters .chip:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 2px; }
.lang button.on { border-bottom-color: var(--brand-primary); }

main.content { padding-block: var(--space-8) var(--space-12); padding-left: max(var(--space-8), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-8), env(safe-area-inset-right, 0px)); width: 100%; max-width: 760px; margin-inline: auto; box-sizing: border-box; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: var(--fs-small); font-weight: 700; color: var(--brand-primary); margin: 0 0 var(--space-1); }
.head h1 { font-size: clamp(2rem, 3.6vw, 3rem); margin-bottom: var(--space-2); }
.lede { font-size: 1.125rem; }

/* filters (the feed's city chips) */
.filters { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: var(--space-6) 0; padding: var(--space-4); background: var(--brand-surface-soft); border-radius: var(--radius-card); }
.chip { display: inline-flex; align-items: center; gap: .4em; font-size: var(--fs-micro); font-weight: 700; letter-spacing: .02em;
  padding: .2em .6em; border-radius: var(--radius-control); background: var(--brand-surface-soft); color: var(--brand-text-soft); }
.chip::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: var(--dot, var(--brand-text-faint)); }
.chip.r { --dot: var(--cat-march); } .chip.ok { --dot: var(--cat-org); } .chip.msg { --dot: var(--cat-media); }
.filters .chip { cursor: pointer; border: 1px solid var(--brand-rule); background: var(--brand-surface); padding: .45em .8em; font: inherit; font-size: var(--fs-small); font-weight: 700; color: var(--brand-text-soft); }
.filters .chip::before { display: none; }
.filters .chip.on { border-color: var(--brand-primary); background: var(--brand-primary); color: var(--brand-on-primary); }

/* feed = timeline */
.timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--space-8); }
.timeline > li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: var(--space-3); border-left: 3px solid var(--brand-primary); padding-left: var(--space-3); }
.timeline > li.ok { border-left-color: var(--cat-org); }
.timeline > li.msg { border-left-color: var(--brand-ink); }
.timeline time { font-weight: 700; font-variant-numeric: tabular-nums; font-size: var(--fs-small); line-height: 1.6; }
.timeline h3 { margin: var(--space-2) 0 var(--space-3); font-size: 1.25rem; }
.item.msg h3 { font-size: var(--fs-h3); }
.place + .place { margin-top: var(--space-3); }
.place h4 { font-size: var(--fs-body); margin: 0 0 var(--space-1); }
.place ul { margin: 0; padding-left: 1.2rem; }
.place li { margin: 0 0 var(--space-1); }
.note { font-size: var(--fs-small); color: var(--brand-text-soft); }
.big { font-size: var(--fs-display); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; margin: var(--space-2) 0 var(--space-3); }
blockquote { margin: var(--space-4) 0 0; padding: var(--space-4); background: var(--brand-tint); border-radius: var(--radius-card); }
blockquote p:last-child { margin: 0; }
.empty { color: var(--brand-text-faint); padding: var(--space-12); text-align: center; }

.site-footer { background: var(--brand-ink); color: var(--brand-on-ink); padding-block: var(--space-8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; font-size: var(--fs-small); }

@media (max-width: 820px) {
  main.content { padding-block: var(--space-6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .timeline > li { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
@media (max-width: 520px) {
  .head h1 { font-size: clamp(1.75rem, 8vw, 2.25rem); line-height: 1.1; }
  .item.msg h3 { font-size: 1.25rem; }
  .big { font-size: 2.5rem; }
}

<script>
const UI = {
  sr: {
    section: `Избори`, title: `Изборни дан уживо`, date: `25. октобар 2026.`,
    tagline: `Излазност, саопштења и неправилности са терена, из сата у сат. Најновије прво.`,
    all: `Све`, msgs: `Саопштења`, irr: `Неправилности`,
    r: `Пријављено`, ok: `Решено`, msg: `Саопштење`, none: `Нема објава за овај филтер.`,
    footer: `Подаци долазе са терена: од контролора, мобилних тимова и правника. Пријаве су наведене онако како су достављене.`,
  },
  en: {
    section: `Elections`, title: `Election day live`, date: `25 October 2026`,
    tagline: `Turnout, statements and irregularities from the field, hour by hour. Latest first.`,
    all: `All`, msgs: `Statements`, irr: `Irregularities`,
    r: `Reported`, ok: `Resolved`, msg: `Statement`, none: `Nothing matches this filter.`,
    footer: `Reports come from the field: our election monitors, mobile teams and legal advisers. They are listed as submitted.`,
  },
};

const REG = {
  bg:    {sr: `Београд`,    en: `Belgrade`},
  sever: {sr: `Север`,      en: `North`},
  zapad: {sr: `Запад`,      en: `West`},
  kg:    {sr: `Крагујевац`, en: `Kragujevac`},
  istok: {sr: `Исток`,      en: `East`},
  jug:   {sr: `Југ`,        en: `South`},
};


// Feed, latest first. k: msg = statement, irr = irregularities (st: r reported, ok resolved; t: hour window).
const FEED = [
  {k:`irr`, reg:`jug`, st:`r`, t:[19,20],
   sr:[[`Сврљиг, Чаир, БМ 42 и 43`, [`У близини бирачких места примећена су два комбија. Према информацијама са терена, постоји сумња да се у њима налазе особе наоружане палицама. Полиција је обавештена.`]]],
   en:[[`Svrljig, Čair, polling stations 42 and 43`, [`Two vans were spotted near the polling stations. According to reports from the field, the people inside are suspected of being armed with clubs. The police have been informed.`]]]},
  {k:`irr`, reg:`zapad`, st:`r`, t:[19,20],
   sr:[[`Ужице`, [`Пријављено је бушење гума на возилима широм града.`]],
       [`Љубовија`, [`Пријављени су легитимисање и претресање чланова мобилних тимова.`]],
       [`Шабац`, [`Према информацијама са терена, начелник полиције упућивао је претње грађанима. Пријављено је и постојање паралелних бирачких спискова.`]]],
   en:[[`Užice`, [`Tyres were reported to have been slashed on vehicles across the town.`]],
       [`Ljubovija`, [`Members of the mobile teams were reportedly subjected to identity checks and searches.`]],
       [`Šabac`, [`According to reports from the field, the police chief threatened citizens. Parallel electoral registers were also reported.`]]]},
  {k:`irr`, reg:`kg`, st:`r`, t:[19,20],
   sr:[[`Чачак, БМ 11, ОШ „Др Драгиша Мишовић“`, [`Спречен је покушај поновног гласања истог бирача.`]],
       [`Крагујевац, Аеродром, ОШ „Мирко Јовановић“`, [`Пријављено је постојање паралелног бирачког списка. Према информацијама са терена, полиција је привела особе код којих је пронађен паралелни бирачки списак.`]]],
   en:[[`Čačak, polling station 11, Dr Dragiša Mišović Primary School`, [`An attempt at multiple voting was prevented.`]],
       [`Kragujevac, Airport, Mirko Jovanović Primary School`, [`A parallel electoral register was reported. According to reports from the field, the police took in for questioning the people found holding it.`]]]},
  {k:`msg`, at:`20:00`,
   sr:{h:`Бирачка места се затварају`, p:[`20 је часова. Бирачка места се затварају.`, `Подсећамо све грађане који су заузели место у редовима пре 20.00 часова да имају још увек право да искажу своју бирачку вољу.`]},
   en:{h:`Polling stations are closing`, p:[`It is 8:00 PM. Polling stations are closing.`, `We remind all citizens who were already in line before 8:00 PM that they still have the right to cast their vote.`]}},
  {k:`irr`, reg:`istok`, st:`ok`, t:[18,19],
   sr:{lead:`У овом периоду нема решених неправилности.`}, en:{lead:`No irregularities were resolved in this period.`}},
  {k:`msg`,
   sr:{h:`Србија није само Београд`, lead:`Затварањем бирачких места изборни процес није завршен.`,
       p:[`Затварањем бирачких места изборни процес није завршен. Следе бројање гласова, записници и предаја изборног материјала локалним изборним комисијама.`,
          `После оваквог дана и овакве излазности, не смемо да дозволимо да нам било ко у последњим сатима угрози оно за шта смо се толико борили!`,
          `Зато останите у својим местима. Будите уз наше контролоре, пратите шта се дешава и помозите да се сваки глас сачува мирно и достојанствено.`,
          `Вечерас нам цела Србија треба тамо где је данас гласала.`,
          `**Србија није у Београду. Србија је у Србији!**`]},
   en:{h:`Serbia is not just Belgrade`, lead:`The electoral process does not end when the polling stations close.`,
       p:[`The electoral process does not end when the polling stations close. Next come the counting of votes, the results protocols and the handover of election material to the local electoral commissions.`,
          `After a day like this and a turnout like this, we must not let anyone, in the final hours, put at risk what we have fought so hard for!`,
          `So stay in your towns. Stand by our election monitors, keep watch on what is happening, and help make sure every vote is protected, calmly and with dignity.`,
          `Tonight we need all of Serbia to be where it voted today.`,
          `**Serbia is not in Belgrade. Serbia is in Serbia!**`]}},
  {k:`irr`, reg:`sever`, st:`ok`, t:[18,19],
   sr:[[`Пећинци`, [`Покушај гласања ван бирачког места у име друге особе. Гласачки листић је постао неважећи.`]]],
   en:[[`Pećinci`, [`An attempt was made to vote outside the polling station (mobile voting) on behalf of another person (proxy voting). The ballot paper was declared invalid.`]]]},
  {k:`irr`, reg:`bg`, st:`r`,
   sr:[[`Гроцка`, [`Гласање је заустављено због фотографисања гласачког листића.`]],
       [`Младеновац`, [`**Бирачко место 13:** Гласање је заустављено због проналаска два гласачка листића у једној коверти коју је донела комисија за гласање ван бирачког места. Локална изборна комисија кренула је ка бирачком месту.`]],
       [`Лазаревац`, [`**Бирачка места 20 и 65:** Пронађени су паралелни бирачки спискови.`]]],
   en:[[`Grocka`, [`Voting was stopped because of the photographing of a ballot paper.`]],
       [`Mladenovac`, [`**Polling station 13:** Voting was stopped after two ballot papers were found in a single envelope brought back by the mobile voting team. The local electoral commission set off for the polling station.`]],
       [`Lazarevac`, [`**Polling stations 20 and 65:** Parallel electoral registers were found.`]]]},
  {k:`irr`, reg:`kg`, st:`ok`, t:[18,19],
   sr:[[`Љиг`, [`**Бирачко место 29:** Спречено је фотографисање гласачког листића.`]],
       [`Крушевац`, [`**Бирачко место 37:** Одузет је паралелни бирачки списак.`]]],
   en:[[`Ljig`, [`**Polling station 29:** An attempt to photograph a ballot paper was prevented.`]],
       [`Kruševac`, [`**Polling station 37:** A parallel electoral register was confiscated.`]]]},
  {k:`msg`,
   sr:{h:`Добро вече, Србијо!`,
       p:[`Србијо, остало је мање од два сата до затварања бирачких места. Сунце је већ зашло, али изборни дан још траје!`,
          `Пре него што саопштимо податке о излазности, подсећамо вас на важно правило: **ако се у 20 часова затекнете у реду на бирачком месту, имате право да гласате!**`,
          `Према нашем репрезентативном узорку, до овог тренутка гласало је **64,2% бирача**. Овај проценат већ надмашује излазност у претходна два изборна процеса.`,
          `Према подацима РИК-а, на претходним изборима до 18 часова излазност је износила 51,93%. **Већ је премашена и укупна излазност на парламентарним изборима 2023. године!**`,
          `До 18 часова гласало је **4.400.000 људи!**`,
          `Излазност и даље расте! Изађите и ви, и допринесите да он буде још снажнији. Пред нама су још готово два сата до затварања бирачких места.`,
          `Сваки глас је важан. Ваш глас је важан. Не стајемо до самог краја изборног дана. На корак смо од тога да испишемо историју и остваримо највећу излазност у историји Србије!`,
          `Наши тимови и даље су на терену. Наши контролори остају на бирачким местима, а људи и даље чекају у редовима.`,
          `Молимо грађане да остану прибрани и позивамо све учеснике изборног процеса да омогуће да се он мирно приведе крају.`,
          `**Србија није само Београд.** Останите у редовима и сачекајте свој ред. Наши контролори у овим тренуцима имају огромну одговорност. Пружите им подршку и будите им ветар у леђа.`,
          `**Сваком грађанину мора бити омогућено да оствари своје право гласа. До краја!**`],
       quote:{by:`Ана Димитријевић`, p:[`**Излазност је већа него у последња два изборна циклуса!**`, `Хајде да заједно наставимо до краја!`, `**Искористите своје право: бирајте своју будућност!**`]}},
   en:{h:`Good evening, Serbia!`,
       p:[`Serbia, there are less than two hours left until the polling stations close. The sun has already set, but election day is not over yet!`,
          `Before we share the turnout figures, a reminder of an important rule: **if you are in the queue at a polling station at 20:00, you have the right to vote!**`,
          `According to our representative sample, **64.2% of voters** have voted so far. This already exceeds the turnout in the previous two elections.`,
          `According to Republic Electoral Commission (RIK) data, turnout in the previous elections by 18:00 was 51.93%. **The total turnout in the 2023 parliamentary elections has already been exceeded!**`,
          `By 18:00, **4,400,000 people had voted!**`,
          `Turnout is still rising! Go out and vote too, and help make it even stronger. There are still almost two hours until the polling stations close.`,
          `Every vote matters. Your vote matters. We are not stopping until the very end of election day. We are one step away from making history and achieving the highest turnout in Serbia's history!`,
          `Our teams are still in the field. Our election monitors are staying at the polling stations, and people are still waiting in the queues.`,
          `We ask citizens to stay calm, and we call on everyone taking part in the electoral process to let it come to a peaceful end.`,
          `**Serbia is not just Belgrade.** Stay in the queues and wait your turn. Our election monitors carry an enormous responsibility right now. Support them and be the wind in their sails.`,
          `**Every citizen must be able to exercise their right to vote. Until the very end!**`],
       quote:{by:`Ana Dimitrijević`, p:[`**Turnout is higher than in the last two election cycles!**`, `Let's keep going together until the end!`, `**Use your right: choose your future!**`]}}},
  {k:`irr`, reg:`bg`, st:`r`, t:[17,18],
   sr:[[`Младеновац`, [`**Бирачко место 31:** Пријављено је убацивање гласова без потврде. Контролор Студентске листе–Студенти побеђују поклопио је гласачку кутију и зауставио гласање, након чега је физички нападнут. Локална изборна комисија упутила се на бирачко место.`]],
       [`Вождовац`, [`**Бирачко место 33:** Одузети су дупли бирачки спискови.`]]],
   en:[[`Mladenovac`, [`**Polling station 31:** Ballots were reportedly being put into the ballot box without verification, i.e. ballot box stuffing. An election monitor from the Student List – Students Win covered the ballot box and stopped the voting, after which they were physically attacked. The local electoral commission set off for the polling station.`]],
       [`Voždovac`, [`**Polling station 33:** Duplicate electoral registers were confiscated.`]]]},

  {k:`msg`,
   sr:{h:`Србија је већ сатима будна!`,
       p:[`Зато, добар дан, Србијо! Добро јутро, добар дан и добро вече, дијаспоро!`,
          `Од седам сати јутрос број људи на бирачким местима не опада. Грађани и даље стрпљиво и мирно чекају у редовима, како у Србији тако и у дијаспори. Сада је прави тренутак да гласате и ви који то до сада нисте учинили.`,
          `Бирачи у дијаспори данас прелазе хиљаде километара како би остварили своје право гласа. Поздраве шаљемо свим нашим грађанима који су нам се јавили након што су прешли пола света како би се и њихов глас чуо. Неки су устали усред ноћи, неки су гласали у пиџамама, а неки нису ни спавали. Прво коло данашњег дана заиграно је у Торонту, у пола два ујутру. Велики поздрав свима!`,
          `**Излазност до 14 часова износи 46,3 одсто**, према нашем репрезентативном узорку. Према подацима РИК-а, на претходним изборима до 14 часова излазност је износила 32,38 одсто.`,
          `До 14 часова гласало је **три милиона људи!**`,
          `Учинимо ове бројеве још већим. Направимо још већу разлику, стрпљиво и одговорно.`,
          `У односу на претходни пресек, последња два сата обележила је додатна ескалација насиља над грађанима. Пријављене су ситуације у Панчеву, на Палилули, Старом граду, Звездари, у Дољевцу и Новом Саду. Наши тимови су о свим наведеним ситуацијама обавестили полицију и очекујемо да оне буду што пре разрешене.`,
          `Подсећамо још једном: сваки облик насиља и притиска на бираче је недопустив. Очекујемо да сви који су одговорни за такве поступке сносе последице у складу са законом.`,
          `Наши вредни људи од раних јутарњих часова чувају гласове и бирачка места, а сви ми чувамо њих.`,
          `**Остало је још само шест сати до затварања бирачких места.** Позивамо све да буду стрпљиви, сачекају свој ред, чак и у случају привремених прекида гласања, и остваре своје право гласа. Чекали смо овај дан две године, можемо још пар сати.`]},
   en:{h:`Serbia has been awake for hours!`,
       p:[`So, good afternoon, Serbia! Good morning, good afternoon and good evening, diaspora!`,
          `Since 7:00 this morning the number of people at polling stations has not decreased. Citizens continue to wait patiently and peacefully in queues, both in Serbia and across the diaspora. If you haven't voted yet, now is the perfect time.`,
          `Voters in the diaspora are travelling thousands of kilometres today to exercise their right to vote. We send our greetings to all our fellow citizens who reached out to us after travelling halfway around the world to make sure their voices are heard too. Some of them woke up in the middle of the night, some voted in their pyjamas, and others didn't sleep at all. The first kolo of the day was danced in Toronto at 01:30. A big shout-out to everyone!`,
          `**Turnout by 14:00 is 46.3%**, according to our representative sample. According to Republic Electoral Commission (RIK) data, turnout by 14:00 in the previous elections was 32.38%.`,
          `By 14:00, **three million people** had voted!`,
          `Let's make these numbers even higher. Let's make an even greater difference, patiently and responsibly.`,
          `Compared with the previous update, the last two hours have been marked by a further escalation of violence against citizens. Incidents were reported in Pančevo, Palilula, Stari Grad, Zvezdara, Doljevac and Novi Sad. Our teams have notified the police about all of them, and we expect them to be resolved as soon as possible.`,

// ── Rendering ──
const qs = new URLSearchParams(location.search);
let lang = qs.get(`lang`) || store(`izbori.lang`) || `sr`;
let filter = `all`; // all | msg | irr | region key
const $ = s => document.querySelector(s);

function store(k, v){
  try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; }
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function md(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, `<strong>$1</strong>`)
    .replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, `<a href="$2" target="_blank" rel="noopener">$1</a>`);
}
function hours(t){
  if(!t) return ``;
  const [a, b] = t;
  if(a === null) return lang === `sr` ? `до ${b}:00` : `by ${b}:00`;
  return `${a}:00–${b}:00`;
}
function matches(it){
  if(filter === `all`) return true;
  if(filter === `msg` || filter === `irr`) return it.k === filter;
  return it.k === `irr` && it.reg === filter;
}

function renderFilters(){
  const L = UI[lang];
  const chip = (f, label) => `<button class="chip${filter === f ? ` on` : ``}" data-f="${f}">${label}</button>`;
  $(`#flt`).innerHTML = chip(`all`, L.all) + chip(`msg`, L.msgs) + chip(`irr`, L.irr) +
    Object.keys(REG).map(k => chip(k, REG[k][lang])).join(``);
}

function renderItem(it){
  const L = UI[lang], c = it[lang];
  if(it.k === `msg`){
    return `<li class="item msg">
      <time>${it.at || ``}</time>
      <div>
        <span class="chip msg">${L.msg}</span>
        <h3>${md(c.h)}</h3>
        ${c.big ? `<div class="big">${md(c.big)}</div>` : ``}
        ${c.lead ? `<p class="faint">${md(c.lead)}</p>` : ``}
        ${(c.p || []).map(p => `<p>${md(p)}</p>`).join(``)}
        ${c.quote ? `<blockquote><p class="faint">${esc(c.quote.by)}:</p>${c.quote.p.map(p => `<p>${md(p)}</p>`).join(``)}</blockquote>` : ``}
      </div>
    </li>`;
  }
  const places = Array.isArray(c) ? c : [];
  return `<li class="item ${it.st}">
    <time>${hours(it.t)}</time>
    <div>
      <span class="chip ${it.st}">${L[it.st]}</span>
      <h3>${REG[it.reg][lang]}</h3>
      ${c.lead ? `<p class="faint">${md(c.lead)}</p>` : ``}
      ${places.map(([name, items, note]) => `<div class="place">
        <h4>${md(name)}</h4>
        ${note ? `<p class="note">${md(note)}</p>` : ``}
        <ul>${items.map(i => `<li>${md(i)}</li>`).join(``)}</ul>
      </div>`).join(``)}
    </div>
  </li>`;
}

function renderFeed(){
  const items = FEED.filter(matches);
  $(`#feed`).innerHTML = items.length ? items.map(renderItem).join(``) : `<li class="empty">${UI[lang].none}</li>`;
}

function render(){
  const L = UI[lang];
  document.documentElement.lang = lang;
  
  $(`#date`).textContent = L.date;
  document.querySelectorAll(`[data-t]`).forEach(el => el.textContent = L[el.dataset.t]);
  document.querySelectorAll(`[data-lang]`).forEach(b => b.classList.toggle(`on`, b.dataset.lang === lang));
  renderFilters(); renderFeed();
}

document.addEventListener(`click`, e => {
  const l = e.target.closest(`[data-lang]`);
  if(l){ lang = l.dataset.lang; store(`izbori.lang`, lang); render(); return; }
  const f = e.target.closest(`[data-f]`);
  if(f){ filter = f.dataset.f; renderFilters(); renderFeed(); }
});
render();
</script>
